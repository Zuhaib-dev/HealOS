version: '3.8'

services:
  # ---------------------------
  # MongoDB Database
  # ---------------------------
  mongodb:
    image: mongo:7.0
    container_name: healos_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healos
    volumes:
      - mongodb_data:/data/db
    networks:
      - healos_network

  # ---------------------------
  # Redis Cache / Message Broker
  # ---------------------------
  redis:
    image: redis:7.2-alpine
    container_name: healos_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - healos_network

networks:
  healos_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
