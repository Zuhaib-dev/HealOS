services:
  # ---------------------------
  # MongoDB Database
  # ---------------------------
  mongodb:
    image: mongo:7.0
    container_name: healos_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healos
    volumes:
      - mongodb_data:/data/db
    networks:
      - healos_network

  # ---------------------------
  # Redis Cache / Message Broker
  # ---------------------------
  redis:
    image: redis:7.2-alpine
    container_name: healos_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - healos_network

  # ---------------------------
  # Express API Backend
  # ---------------------------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: healos_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/healos
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb
      - redis
    networks:
      - healos_network

  # ---------------------------
  # Next.js Client Frontend
  # ---------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: healos_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - server
    networks:
      - healos_network

networks:
  healos_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
